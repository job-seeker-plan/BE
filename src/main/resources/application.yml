server:
  port: 8000
  servlet:
    session:
      cookie:
        same-site: lax

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  ai-base-url: ${AI_SERVICE_URL:http://localhost:8001}
  ai-service-token: ${AI_SERVICE_TOKEN:}
  gov-api-key: ${GOV_API:}
  google-client-id: ${OAUTH_GOOGLE_CLIENT_ID:}
  google-client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:}
  kakao-client-id: ${OAUTH_KAKAO_CLIENT_ID:}
  kakao-client-secret: ${OAUTH_KAKAO_CLIENT_SECRET:}
  naver-client-id: ${OAUTH_NAVER_CLIENT_ID:}
  naver-client-secret: ${OAUTH_NAVER_CLIENT_SECRET:}

spring:
  config:
    # Works no matter which directory `mvn spring-boot:run` (or an IDE run
    # configuration) is launched from: BE/.env is always the canonical file.
    # `.env` covers running from inside BE/, `BE/.env` covers running from the
    # project root (also the common case for IDE run configs).
    import: optional:file:BE/.env[.properties],optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/job_planner}
    username: ${DATABASE_USERNAME:job_planner}
    password: ${DATABASE_PASSWORD:job_planner}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
