services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: job_planner
      POSTGRES_USER: job_planner
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in BE/.env or your shell}
    volumes:
      - planner-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_planner -d job_planner"]
      interval: 5s
      timeout: 3s
      retries: 20

  ai:
    build: ../AI
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN in BE/.env or your shell}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SARAMIN_ACCESS_KEY: ${SARAMIN_ACCESS_KEY:-}
      # job_jd_embeddings 테이블은 V3 마이그레이션으로 이 postgres 서비스(job_planner
      # DB)에 이미 생성돼있음 - 로컬 테스트용 pgvector-test 컨테이너(포트5433, host
      # 기준 localhost)와는 별개. 컨테이너 안에서는 "postgres"가 서비스명이라 이걸로 접속.
      PGVECTOR_HOST: postgres
      PGVECTOR_PORT: "5432"
      PGVECTOR_DB: job_planner
      PGVECTOR_USER: job_planner
      PGVECTOR_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in BE/.env or your shell}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8001"

  be:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_started
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/job_planner
      DATABASE_USERNAME: job_planner
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in BE/.env or your shell}
      AI_SERVICE_URL: http://ai:8001
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN in BE/.env or your shell}
      GOV_API: ${GOV_API:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_KAKAO_CLIENT_ID: ${OAUTH_KAKAO_CLIENT_ID:-}
      OAUTH_KAKAO_CLIENT_SECRET: ${OAUTH_KAKAO_CLIENT_SECRET:-}
      OAUTH_NAVER_CLIENT_ID: ${OAUTH_NAVER_CLIENT_ID:-}
      OAUTH_NAVER_CLIENT_SECRET: ${OAUTH_NAVER_CLIENT_SECRET:-}
    ports:
      - "8000:8000"

volumes:
  planner-postgres:
